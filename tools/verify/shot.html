<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>screenshot frame</title>
<meta name="robots" content="noindex">
<!-- Chrome headless will not make a window narrower than about 500px, so phone-width shots are taken through a fixed-width iframe. -->
<style>html,body{margin:0;background:#888}iframe{border:0;display:block;background:#fff}</style>
</head>
<body>
<script>
var q = new URLSearchParams(location.search);
var f = document.createElement("iframe");
f.style.width = (q.get("w") || 375) + "px";
f.style.height = (q.get("h") || 667) + "px";
f.src = q.get("u");
document.body.appendChild(f);
</script>
</body>
</html>
